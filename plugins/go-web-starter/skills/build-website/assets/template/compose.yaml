services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: website
      POSTGRES_USER: website
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 setup.py to create .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U website -d website"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://website:${POSTGRES_PASSWORD}@db:5432/website?sslmode=disable
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8080}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  database:
